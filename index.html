<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐉 DBE REWARDS 🐉 - Conectando...</title>

    <!-- Etiquetas para que se vea bien en Discord y redes sociales -->
    <meta property="og:title" content="DBE REWARDS 🐉 | Servidor de Minecraft Bedrock">
    <meta property="og:description" content="¡Únete a la aventura! Haz clic para abrir Minecraft y conectar directamente.">
    <meta property="og:image" content="https://xxterror19.github.io/Servidor-Dragon_Evolution/logo.png">
    <meta property="og:url" content="https://xxterror19.github.io/Servidor-Dragon_Evolution/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://xxterror19.github.io/Servidor-Dragon_Evolution/logo.png">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            overflow-x: hidden;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            background: linear-gradient(-45deg, #ff6b00, #ff9500, #ffcc00, #ff6b00);
            background-size: 400% 400%;
            animation: fondoAnimado 8s ease infinite;
            color: #ffffff;
        }

        @keyframes fondoAnimado {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .logo {
            max-width: 400px;
            width: 90%;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(255, 150, 0, 0.9))
                    drop-shadow(0 0 30px rgba(255, 80, 0, 0.6));
            animation: flotarLogo 3s ease-in-out infinite;
        }

        @keyframes flotarLogo {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.03); }
        }

        .container {
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #ffcc00;
            border-radius: 20px;
            padding: 35px 30px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.6);
            animation: brillo 3s ease-in-out infinite alternate;
        }

        @keyframes brillo {
            from { box-shadow: 0 0 20px rgba(255, 204, 0, 0.4); }
            to { box-shadow: 0 0 40px rgba(255, 204, 0, 0.9); }
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #ffcc00;
            text-shadow: 0 0 10px #ff6b00, 0 0 20px #ff6b00;
            animation: flotar 2s ease-in-out infinite;
        }

        @keyframes flotar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .cargando {
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: #ffffff;
        }

        .cargando span {
            animation: puntos 1.5s infinite;
        }

        .cargando span:nth-child(2) { animation-delay: 0.3s; }
        .cargando span:nth-child(3) { animation-delay: 0.6s; }

        @keyframes puntos {
            0%, 20% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }

        .btn {
            display: inline-block;
            background: linear-gradient(45deg, #ff6b00, #ffcc00);
            color: #000000;
            padding: 18px 35px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.7);
            animation: pulso 1.5s ease-in-out infinite;
            width: 100%;
            max-width: 320px;
        }

        @keyframes pulso {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .btn:hover {
            transform: scale(1.1);
        }

        .info {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #cccccc;
            line-height: 1.6;
        }

        code {
            background-color: rgba(255, 204, 0, 0.2);
            padding: 4px 10px;
            border-radius: 6px;
            color: #ffcc00;
            font-size: 0.85rem;
            display: inline-block;
            margin: 3px 0;
            word-break: break-all;
        }

        .esferas {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .esfera {
            width: 35px;
            height: 35px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(255, 180, 0, 0.9));
            animation: brilloEsfera 2s ease-in-out infinite alternate;
        }

        .esfera:nth-child(1) { animation-delay: 0s; }
        .esfera:nth-child(2) { animation-delay: 0.3s; }
        .esfera:nth-child(3) { animation-delay: 0.6s; }
        .esfera:nth-child(4) { animation-delay: 0.9s; }
        .esfera:nth-child(5) { animation-delay: 1.2s; }
        .esfera:nth-child(6) { animation-delay: 1.5s; }
        .esfera:nth-child(7) { animation-delay: 1.8s; }

        @keyframes brilloEsfera {
            from { filter: drop-shadow(0 0 8px rgba(255, 180, 0, 0.6)); }
            to { filter: drop-shadow(0 0 20px rgba(255, 220, 0, 1)); }
        }

        @media (max-width: 480px) {
            .logo { max-width: 260px; }
            h1 { font-size: 1.4rem; }
            .btn { font-size: 1rem; padding: 15px 25px; }
            .container { padding: 25px 18px; }
            .esfera { width: 28px; height: 28px; }
        }
    </style>
</head>
<body>

    <img src="logo.png" alt="Dragon Ball Z" class="logo">

    <div class="container">
        <h1>🐉 DBE REWARDS 🐉</h1>
        <p class="cargando" id="txt-cargando">Abriendo Minecraft<span>.</span><span>.</span><span>.</span></p>

        <a href="minecraft://?addExternalServer=DBE-REWARDS|mc.zelixhost.com:25828" class="btn" id="txt-boton">
            ⚡ ABRIR MINECRAFT ⚡
        </a>

        <div class="info">
            <p id="txt-info1">Si no se abre solo, agrega el servidor manualmente:</p>
            <p>IP: <code>mc.zelixhost.com</code> | Puerto: <code>25828</code></p>

            <div class="esferas">
                <img src="esfera1.png" alt="Esfera 1" class="esfera">
                <img src="esfera2.png" alt="Esfera 2" class="esfera">
                <img src="esfera3.png" alt="Esfera 3" class="esfera">
                <img src="esfera4.png" alt="Esfera 4" class="esfera">
                <img src="esfera5.png" alt="Esfera 5" class="esfera">
                <img src="esfera6.png" alt="Esfera 6" class="esfera">
                <img src="esfera7.png" alt="Esfera 7" class="esfera">
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 🌍 TRADUCCIONES POR IDIOMA
        // ==========================================
        const traducciones = {
            es: {
                titulo: "Abriendo Minecraft",
                boton: "⚡ ABRIR MINECRAFT ⚡",
                info1: "Si no se abre solo, agrega el servidor manualmente:"
            },
            en: {
                titulo: "Opening Minecraft",
                boton: "⚡ OPEN MINECRAFT ⚡",
                info1: "If it doesn't open automatically, add the server manually:"
            },
            pt: {
                titulo: "Abrindo Minecraft",
                boton: "⚡ ABRIR MINECRAFT ⚡",
                info1: "Se não abrir sozinho, adicione o servidor manualmente:"
            },
            fr: {
                titulo: "Ouverture de Minecraft",
                boton: "⚡ OUVRIR MINECRAFT ⚡",
                info1: "S'il ne s'ouvre pas automatiquement, ajoutez le serveur manuellement :"
            }
        };

        // ==========================================
        // 🌐 DETECTAR IDIOMA DEL NAVEGADOR
        // ==========================================
        function detectarIdioma() {
            const idiomaNavegador = navigator.language || navigator.userLanguage || "en";
            const codigo = idiomaNavegador.substring(0, 2).toLowerCase();
            if (traducciones[codigo]) {
                return codigo;
            }
            return "en";
        }

        // ==========================================
        // ✏️ APLICAR TRADUCCIONES A LA PÁGINA
        // ==========================================
        function aplicarTraduccion() {
            const idioma = detectarIdioma();
            const t = traducciones[idioma];

            document.getElementById("txt-cargando").innerHTML =
                t.titulo + '<span>.</span><span>.</span><span>.</span>';
            document.getElementById("txt-boton").textContent = t.boton;
            document.getElementById("txt-info1").textContent = t.info1;

            document.documentElement.lang = idioma;
        }

        // ==========================================
        // ⚡ REDIRECCIÓN AUTOMÁTICA A MINECRAFT
        // ==========================================
        window.onload = function() {
            aplicarTraduccion();

            setTimeout(function() {
                window.location.href = "minecraft://?addExternalServer=DBE-REWARDS|mc.zelixhost.com:25828";
            }, 800);
        };
    </script>

</body>
</html>
